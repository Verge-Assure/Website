    <circle cx="60" cy="190" r="4" fill="#1a2840"/>
    <circle cx="100" cy="200" r="8" fill="none" stroke="#1e3050" stroke-width="2"/>
    <circle cx="100" cy="200" r="3" fill="#1a2840"/>
    <circle cx="140" cy="185" r="11" fill="none" stroke="#1e3050" stroke-width="2"/>
    <circle cx="140" cy="185" r="4.5" fill="#1a2840"/>
    <circle cx="185" cy="195" r="9" fill="none" stroke="#1e3050" stroke-width="2"/>
    <circle cx="185" cy="195" r="3.5" fill="#1a2840"/>
    <circle cx="75" cy="230" r="8" fill="none" stroke="#1e3050" stroke-width="2"/>
    <circle cx="75" cy="230" r="3" fill="#1a2840"/>
    <circle cx="120" cy="240" r="10" fill="none" stroke="#1e3050" stroke-width="2"/>
    <circle cx="120" cy="240" r="4" fill="#1a2840"/>
    <circle cx="165" cy="228" r="7" fill="none" stroke="#1e3050" stroke-width="2"/>
    <circle cx="165" cy="228" r="3" fill="#1a2840"/>
    <circle cx="215" cy="210" r="9" fill="none" stroke="#1e3050" stroke-width="2"/>
    <circle cx="215" cy="210" r="3.5" fill="#1a2840"/>
  </g>
  <!-- Falling hailstones (foreground, larger) -->
  <g fill="#2a4a6a" opacity="0.7">
    <ellipse cx="45" cy="130" rx="7" ry="7"/>
    <ellipse cx="160" cy="115" rx="8" ry="8"/>
    <ellipse cx="230" cy="140" rx="6" ry="6"/>
    <ellipse cx="95" cy="148" rx="5" ry="5"/>
  </g>
  <!-- Label -->
  <rect y="373" width="267" height="27" fill="rgba(0,0,0,0.45)"/>
  <text x="16" y="391" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" fill="rgba(255,255,255,0.88)">HAIL DAMAGE</text>
  <text x="251" y="13" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="rgba(255,255,255,0.28)">replace with photo</text>

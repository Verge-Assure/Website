<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 267 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060e18"/>
      <stop offset="100%" stop-color="#102030"/>
    </linearGradient>
  </defs>
  <rect width="267" height="400" fill="url(#bg)"/>
  <!-- Falling hailstones (background) -->
  <g fill="#1a3a58" opacity="0.5">
    <ellipse cx="30" cy="40" rx="5" ry="5"/>
    <ellipse cx="80" cy="20" rx="4" ry="4"/>
    <ellipse cx="140" cy="55" rx="6" ry="6"/>
    <ellipse cx="200" cy="30" rx="4" ry="4"/>
    <ellipse cx="240" cy="60" rx="5" ry="5"/>
    <ellipse cx="55" cy="90" rx="3" ry="3"/>
    <ellipse cx="170" cy="80" rx="5" ry="5"/>
    <ellipse cx="220" cy="100" rx="3" ry="3"/>
  </g>
  <!-- Car roof surface -->
  <path d="M20,180 Q30,160 80,158 L190,158 Q230,160 248,180 L248,260 Q234,268 134,270 Q40,268 20,260Z"
        fill="#141c28" stroke="#243040" stroke-width="1.5"/>
  <!-- Windshield crack -->
  <path d="M70,158 Q80,130 134,125 Q188,130 200,158Z" fill="#0e1620" stroke="#1e2a38" stroke-width="1"/>
  <path d="M120,140 L108,155" stroke="#2a3848" stroke-width="1" stroke-linecap="round"/>
  <path d="M108,155 L98,152" stroke="#2a3848" stroke-width="1" stroke-linecap="round"/>
  <!-- Hail dents on roof -->
  <g opacity="0.85">

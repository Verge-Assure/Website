<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 267 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#101e38"/>
    </linearGradient>
  </defs>
  <rect width="267" height="400" fill="url(#bg)"/>
  <!-- Rain streaks -->
  <g stroke="#1a3060" stroke-width="0.8" opacity="0.5">
    <line x1="20" y1="0" x2="10" y2="80"/>
    <line x1="50" y1="0" x2="40" y2="80"/>
    <line x1="80" y1="0" x2="70" y2="80"/>
    <line x1="110" y1="0" x2="100" y2="80"/>
    <line x1="140" y1="0" x2="130" y2="80"/>
    <line x1="170" y1="0" x2="160" y2="80"/>
    <line x1="200" y1="0" x2="190" y2="80"/>
    <line x1="240" y1="0" x2="230" y2="80"/>
    <line x1="35" y1="80" x2="22" y2="160"/>
    <line x1="65" y1="80" x2="52" y2="160"/>
    <line x1="95" y1="80" x2="82" y2="160"/>
    <line x1="125" y1="80" x2="112" y2="160"/>
    <line x1="155" y1="80" x2="142" y2="160"/>
    <line x1="185" y1="80" x2="172" y2="160"/>
    <line x1="220" y1="80" x2="207" y2="160"/>
    <line x1="255" y1="80" x2="242" y2="160"/>
  </g>
  <!-- House -->
  <polygon points="44,250 44,210 134,160 224,210 224,250" fill="#0c1428" stroke="#1a2848" stroke-width="1.5"/>
  <rect x="60" y="213" width="36" height="30" fill="#081020"/>
  <rect x="112" y="213" width="36" height="30" fill="#081020"/>
  <rect x="112" y="225" width="36" height="25" fill="#060c18"/>
  <!-- Door -->
  <rect x="118" y="230" width="24" height="20" fill="#060a16"/>
  <!-- Tree (fallen, diagonal) -->
  <line x1="224" y1="210" x2="134" y2="190" stroke="#1a2a18" stroke-width="8" stroke-linecap="round"/>
  <line x1="134" y1="190" x2="120" y2="175" stroke="#162416" stroke-width="6" stroke-linecap="round"/>
  <!-- Branch clusters -->
  <ellipse cx="170" cy="196" rx="22" ry="12" fill="#0e1e0e" transform="rotate(-20,170,196)" opacity="0.9"/>
  <ellipse cx="135" cy="184" rx="16" ry="9" fill="#0e1e0e" transform="rotate(-25,135,184)" opacity="0.8"/>
  <!-- Lightning bolt -->
  <path d="M200,20 L185,65 L196,65 L178,110" stroke="#c8d840" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ground -->
  <rect x="0" y="250" width="267" height="150" fill="#081018"/>
  <!-- Label -->
  <rect y="373" width="267" height="27" fill="rgba(0,0,0,0.45)"/>
  <text x="16" y="391" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" fill="rgba(255,255,255,0.88)">STORM DAMAGE</text>
  <text x="251" y="13" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="rgba(255,255,255,0.28)">replace with photo</text>
</svg>

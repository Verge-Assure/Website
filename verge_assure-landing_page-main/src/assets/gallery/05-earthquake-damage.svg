  <path d="M188,105 L172,98" fill="none" stroke="#3a2000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M198,112 L218,108" fill="none" stroke="#3a2000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M184,140 L166,138" fill="none" stroke="#3a2000" stroke-width="1.5" stroke-linecap="round"/>

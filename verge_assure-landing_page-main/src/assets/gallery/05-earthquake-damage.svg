      <stop offset="0%" stop-color="#0c0700"/>
      <stop offset="100%" stop-color="#261400"/>
    </linearGradient>
  </defs>
  <rect width="400" height="267" fill="url(#bg)"/>
  <!-- Building structure (cracked) -->
  <rect x="100" y="80" width="200" height="140" fill="#1a0e00" stroke="#3a2000" stroke-width="1.5"/>
  <!-- Windows -->
  <rect x="118" y="100" width="34" height="28" fill="#100800" rx="1"/>
  <rect x="168" y="100" width="34" height="28" fill="#100800" rx="1"/>
  <rect x="248" y="100" width="34" height="28" fill="#100800" rx="1"/>
  <rect x="118" y="148" width="34" height="28" fill="#100800" rx="1"/>
  <rect x="248" y="148" width="34" height="28" fill="#100800" rx="1"/>
  <!-- Cracks on building -->
  <path d="M200,80 L188,105 L198,112 L184,140 L196,148 L180,178 L200,180 L196,220"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 267">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0800"/>
      <stop offset="100%" stop-color="#281500"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cc4400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="char" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#0e0500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="267" fill="url(#bg)"/>
  <!-- Panel/wall surface -->
  <rect x="120" y="40" width="160" height="200" fill="#180c00" stroke="#301800" stroke-width="1.5" rx="3"/>
  <!-- Circuit breaker lines -->
  <g stroke="#2a1800" stroke-width="1.2" fill="none">
    <line x1="150" y1="70" x2="150" y2="200"/>
    <line x1="200" y1="70" x2="200" y2="200"/>
    <line x1="250" y1="70" x2="250" y2="200"/>
    <line x1="120" y1="120" x2="280" y2="120"/>
    <line x1="120" y1="160" x2="280" y2="160"/>
  </g>
  <!-- Burn/char mark -->
  <ellipse cx="200" cy="140" rx="55" ry="45" fill="url(#char)" opacity="0.9"/>
  <ellipse cx="200" cy="140" rx="30" ry="24" fill="#0e0500" opacity="0.8"/>
  <!-- Spark burst at center -->
  <ellipse cx="200" cy="140" rx="40" ry="40" fill="url(#spark)" opacity="0.6"/>
  <!-- Spark rays -->
  <g stroke="#ff9900" stroke-width="1.5" opacity="0.7" stroke-linecap="round">
    <line x1="200" y1="140" x2="200" y2="98"/>
    <line x1="200" y1="140" x2="230" y2="110"/>
    <line x1="200" y1="140" x2="240" y2="140"/>
    <line x1="200" y1="140" x2="228" y2="168"/>
    <line x1="200" y1="140" x2="200" y2="182"/>
    <line x1="200" y1="140" x2="172" y2="168"/>
    <line x1="200" y1="140" x2="160" y2="140"/>
    <line x1="200" y1="140" x2="172" y2="112"/>
  </g>
  <!-- Spark tips (bright dots) -->
  <g fill="#ffe066" opacity="0.9">
    <circle cx="200" cy="98" r="2.5"/>
    <circle cx="230" cy="110" r="2"/>
    <circle cx="240" cy="140" r="2.5"/>
    <circle cx="228" cy="168" r="2"/>
    <circle cx="200" cy="182" r="2.5"/>
    <circle cx="172" cy="168" r="2"/>
    <circle cx="160" cy="140" r="2.5"/>
    <circle cx="172" cy="112" r="2"/>
  </g>
  <!-- Hanging melted wires -->
  <path d="M185,40 Q180,70 190,100" stroke="#2a1400" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M215,40 Q220,75 210,100" stroke="#2a1400" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Smoke tendrils -->
  <path d="M180,80 Q168,60 175,40" stroke="#1a0c00" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M220,78 Q234,55 225,38" stroke="#1a0c00" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M200,76 Q198,52 205,32" stroke="#200e00" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Label -->
  <rect y="240" width="400" height="27" fill="rgba(0,0,0,0.45)"/>
  <text x="16" y="258" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" fill="rgba(255,255,255,0.88)">ELECTRICAL DAMAGE</text>
  <text x="384" y="13" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="rgba(255,255,255,0.28)">replace with photo</text>
</svg>

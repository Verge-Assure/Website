<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 267">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040e18"/>
      <stop offset="100%" stop-color="#082635"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1060a0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#084070" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="267" fill="url(#bg)"/>
  <!-- Ceiling -->
  <rect x="0" y="0" width="400" height="52" fill="#081828"/>
  <!-- Wall texture (light staining) -->
  <rect x="0" y="52" width="400" height="180" fill="#061420"/>
  <!-- Water stain patches on wall -->
  <ellipse cx="120" cy="120" rx="55" ry="40" fill="#0e3060" opacity="0.35"/>
  <ellipse cx="280" cy="140" rx="45" ry="35" fill="#0e2850" opacity="0.3"/>
  <!-- Burst pipe area on ceiling -->
  <ellipse cx="200" cy="48" rx="22" ry="10" fill="#1a4878" opacity="0.7"/>
  <!-- Drip streams -->
  <line x1="190" y1="52" x2="184" y2="190" stroke="#1868b0" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
  <line x1="200" y1="52" x2="196" y2="210" stroke="#1e78c0" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <line x1="210" y1="52" x2="216" y2="185" stroke="#1868b0" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
  <line x1="178" y1="52" x2="168" y2="160" stroke="#145890" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="222" y1="52" x2="232" y2="172" stroke="#145890" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <!-- Drip bulges -->
  <ellipse cx="184" cy="192" rx="5" ry="8" fill="#2080c8" opacity="0.8"/>
  <ellipse cx="196" cy="214" rx="6" ry="9" fill="#1e78c0" opacity="0.85"/>
  <ellipse cx="216" cy="188" rx="5" ry="8" fill="#2080c8" opacity="0.8"/>
  <!-- Water pool on floor -->
  <ellipse cx="200" cy="245" rx="120" ry="16" fill="url(#pool)"/>
  <ellipse cx="200" cy="244" rx="100" ry="10" fill="#1868b0" opacity="0.3"/>
  <!-- Ripple rings in pool -->
  <ellipse cx="200" cy="244" rx="30" ry="4" fill="none" stroke="#2888d0" stroke-width="1" opacity="0.5"/>
  <ellipse cx="200" cy="244" rx="55" ry="7" fill="none" stroke="#2080c0" stroke-width="0.8" opacity="0.35"/>
  <!-- Label -->
  <rect y="240" width="400" height="27" fill="rgba(0,0,0,0.45)"/>
  <text x="16" y="258" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" fill="rgba(255,255,255,0.88)">WATER DAMAGE</text>
  <text x="384" y="13" font-family="system-ui,sans-serif" font-size="9" text-anchor="end" fill="rgba(255,255,255,0.28)">replace with photo</text>
</svg>
